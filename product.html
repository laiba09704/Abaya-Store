<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  
</head>

<body>

<!-- Top Bar -->
<div class="top-bar text-white py-2 text-center">
  <span class="fw-semibold">NO RETURNS / EXCHANGE AFTER DELIVERY</span>
</div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-light-yellow">
  <div class="container d-flex align-items-center">

    <!-- Back Arrow on LEFT -->
    <a href="javascript:history.back()" class="me-3 text-dark">
      <i class="bi bi-arrow-left fs-3"></i>
    </a>

    <!-- Brand -->
    <a class="navbar-brand fw-bold fs-3 mx-auto" href="index.html">
      Abaya_Store
    </a>

  </div>
</nav>

<div class="container my-5">
  <div class="product-detail position-relative">

    <div class="row">
      <div class="col-md-6">
        <img id="productImg" alt="Product Image" class="img-fluid rounded">
      </div>

      <div class="col-md-6">
        <h2 id="productName"></h2>
        <p class="price fs-4">Rs. <span id="productPrice"></span></p>

        <p>
          Elegant premium quality abaya made with soft fabric.
          Perfect for daily and formal wear.
        </p>

        <!-- Quantity Selector -->
        <div class="mb-3">
          <label for="quantityInput">Quantity:</label>
          <div class="input-group" style="width: 140px;">
            <button type="button" id="decreaseQty" class="btn btn-outline-secondary">-</button>
            <input type="number" id="quantityInput" class="form-control text-center" value="1" min="1">
            <button type="button" id="increaseQty" class="btn btn-outline-secondary">+</button>
          </div>
        </div>

        <!-- Wishlist Button -->
        <div class="mb-3">
          <i id="wishlistBtn" class="bi fs-2" style="cursor:pointer;"></i> Add to Wishlist
        </div>

        <div class="action-btns">
          <button id="addToCartBtn" class="btn btn-warning me-2">Add to Cart</button>
          <button id="buyNowBtn" class="btn btn-dark">Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Cart Sidebar -->
<div class="offcanvas offcanvas-end" id="cartSidebar">
  <div class="offcanvas-header">
    <h5>Your Cart</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <ul id="cartItems" class="list-group mb-3"></ul>
    <p id="emptyCartText" class="text-muted text-center">Your cart is empty</p>
    <a href="index.html" class="btn btn-warning w-100">Continue Shopping</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Get product info from URL
  const params = new URLSearchParams(window.location.search);
  const product = {
    name: params.get("name"),
    price: params.get("price"),
    img: params.get("img")
  };

  document.getElementById("productName").innerText = product.name;
  document.getElementById("productPrice").innerText = product.price;
  document.getElementById("productImg").src = product.img;

  // Quantity increment/decrement
  const quantityInput = document.getElementById("quantityInput");
  document.getElementById("increaseQty").addEventListener("click", () => {
    quantityInput.value = parseInt(quantityInput.value) + 1;
  });
  document.getElementById("decreaseQty").addEventListener("click", () => {
    if (parseInt(quantityInput.value) > 1) quantityInput.value = parseInt(quantityInput.value) - 1;
  });

  // Cart rendering function
  function renderCart() {
    const cartItems = document.getElementById("cartItems");
    const emptyText = document.getElementById("emptyCartText");
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cartItems.innerHTML = "";
    if(cart.length === 0){
      emptyText.style.display = "block";
    } else {
      emptyText.style.display = "none";
      cart.forEach((item, index)=> {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        li.innerHTML = `
          <div class="cart-item-info d-flex align-items-center" style="cursor:pointer;">
            <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">
            <span class="ms-2">${item.name} x ${item.quantity} - Rs. ${item.price}</span>
          </div>
          <button class="btn btn-sm btn-danger removeCartBtn" data-index="${index}"><i class="bi bi-x"></i></button>
        `;

        cartItems.appendChild(li);
      });
    }

    cartItems.onclick = function(e) {
      if(e.target.closest(".cart-item-info")){
        const li = e.target.closest("li");
        const index = Array.from(cartItems.children).indexOf(li);
        const item = cart[index];
        window.location.href = `product.html?name=${encodeURIComponent(item.name)}&price=${encodeURIComponent(item.price)}&img=${encodeURIComponent(item.img)}`;
      }

      if(e.target.closest(".removeCartBtn")){
        const btn = e.target.closest(".removeCartBtn");
        const index = btn.getAttribute("data-index");
        cart.splice(index,1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    };
  }

  renderCart();

  // Add to Cart button
  document.getElementById("addToCartBtn").addEventListener("click", ()=> {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const qty = parseInt(quantityInput.value);
    const cartItem = {...product, quantity: qty};
    cart.push(cartItem);
    localStorage.setItem("cart", JSON.stringify(cart));

    // Automatically open cart sidebar
    const cartSidebar = new bootstrap.Offcanvas(document.getElementById("cartSidebar"));
    cartSidebar.show();

    renderCart(); // refresh cart items
  });

  // Buy Now button
  document.getElementById("buyNowBtn").addEventListener("click", () => {
    const qty = parseInt(quantityInput.value);
    const buyURL = `buy.html?name=${encodeURIComponent(product.name)}&price=${encodeURIComponent(product.price)}&img=${encodeURIComponent(product.img)}&quantity=${qty}`;
    window.location.href = buyURL;
  });

  // Wishlist functionality
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
  const wishlistBtn = document.getElementById("wishlistBtn");

  function updateWishlistIcon() {
    const exists = wishlist.find(item => item.name === product.name);
    wishlistBtn.classList.toggle("bi-heart-fill", !!exists);
    wishlistBtn.classList.toggle("bi-heart", !exists);
  }

  wishlistBtn.addEventListener("click", () => {
    const index = wishlist.findIndex(item => item.name === product.name);
    const qty = parseInt(quantityInput.value);
    if(index > -1){
      wishlist.splice(index,1);
    } else {
      wishlist.push({...product, quantity: qty});
    }
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    updateWishlistIcon();
  });

  updateWishlistIcon();
</script>
</body>
</html>
