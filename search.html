<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">


  <div id="backArrow" title="Go Back">&#8592;</div>

  <h2 class="text-center mb-4">Search Products</h2>

  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Search for abayas, hijabs, or collections...">
    <button id="searchBtn">Search</button>
    <div id="suggestions" class="suggestions"></div>
  </div>

  <p id="noResult" style="display:none;">No products found</p>

</div>

<script>
let allProducts = [];
let selectedIndex = -1;

const searchInput = document.getElementById("searchInput");
const suggestionsDiv = document.getElementById("suggestions");
const noResult = document.getElementById("noResult");
const backArrow = document.getElementById("backArrow");

/* ---------------- BACK ARROW ---------------- */
backArrow.addEventListener("click", () => {
  history.back();
});

/* ---------------- LOAD PRODUCTS ---------------- */
fetch("products.json")
  .then(res => {
    if (!res.ok) throw new Error("products.json not found");
    return res.json();
  })
  .then(data => {
    allProducts = data;
  })
  .catch(err => {
    console.error(err);
    noResult.textContent = "Products could not be loaded";
    noResult.style.display = "block";
  });

/* ---------------- SHOW SUGGESTIONS ---------------- */
function showSuggestions() {
  const query = searchInput.value.trim().toLowerCase();

  if (query === "") {
    suggestionsDiv.style.display = "none";
    noResult.style.display = "none";
    return;
  }

  const filtered = allProducts.filter(item =>
    item.name.toLowerCase().includes(query) ||
    item.category.toLowerCase().includes(query)
  );

  suggestionsDiv.innerHTML = "";
  selectedIndex = -1;

  if (filtered.length === 0) {
    suggestionsDiv.style.display = "none";
    noResult.style.display = "block";
    return;
  }

  noResult.style.display = "none";
  suggestionsDiv.style.display = "block";

  filtered.forEach(item => {
    const div = document.createElement("div");
    div.className = "suggestion_item";
    div.textContent = item.name;

    div.addEventListener("click", () => {
      window.location.href =
        `${item.page}?name=${encodeURIComponent(item.name)}&img=${encodeURIComponent(item.img)}&category=${encodeURIComponent(item.category)}`;
    });

    suggestionsDiv.appendChild(div);
  });
}

/* ---------------- KEYBOARD NAVIGATION ---------------- */
searchInput.addEventListener("keydown", e => {
  const items = suggestionsDiv.querySelectorAll(".suggestion_item");
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    selectedIndex = (selectedIndex + 1) % items.length;
    updateActive(items);
  }

  if (e.key === "ArrowUp") {
    e.preventDefault();
    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
    updateActive(items);
  }

  if (e.key === "Enter") {
    e.preventDefault();

    if (selectedIndex > -1) {
      items[selectedIndex].click();
    } else {
      items[0].click();
    }
  }
});

/* ---------------- ACTIVE ITEM ---------------- */
function updateActive(items) {
  items.forEach((el, i) => {
    el.classList.toggle("active", i === selectedIndex);
  });
}

/* ---------------- INPUT LISTENER ---------------- */
searchInput.addEventListener("keyup", e => {
  if (!["ArrowUp", "ArrowDown", "Enter"].includes(e.key)) {
    showSuggestions();
  }
});

/* ---------------- SEARCH BUTTON ---------------- */
document.getElementById("searchBtn").addEventListener("click", () => {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) return;

  const result = allProducts.find(item =>
    item.name.toLowerCase().includes(query) ||
    item.category.toLowerCase().includes(query)
  );

  if (result) {
    window.location.href =
      `${result.page}?name=${encodeURIComponent(result.name)}&img=${encodeURIComponent(result.img)}&category=${encodeURIComponent(result.category)}`;
  } else {
    noResult.style.display = "block";
  }
});

/* ---------------- CLICK OUTSIDE ---------------- */
document.addEventListener("click", e => {
  if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
    suggestionsDiv.style.display = "none";
  }
});
</script>

</body>
</html>
