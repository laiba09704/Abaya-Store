<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Abaya Store</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Top Bar -->
<div class="top-bar text-white py-2 text-center">
  <span class="fw-semibold">NO RETURNS / EXCHANGE AFTER DELIVERY</span>
</div>

<!-- Navbar -->
<nav class="navbar navbar-light bg-light-yellow">
  <div class="container d-flex justify-content-between align-items-center">

    <button class="btn p-0 border-0" type="button">
      <i class="bi bi-list fs-2"></i>
    </button>

    <a class="navbar-brand fw-bold fs-3" href="index.html">Abaya_Store</a>

    <div class="d-flex align-items-center gap-3">
      <a href="#" class="text-dark"><i class="bi bi-search fs-5"></i></a>
      <a href="wishlist.html" class="text-dark"><i class="bi bi-heart fs-5"></i></a>
      <a href="#" class="text-dark"><i class="bi bi-bag fs-5"></i></a>
      <a href="login.html" class="text-dark"><i class="bi bi-person fs-4"></i></a>
    </div>

  </div>
</nav>

<!-- LOGIN FORM -->
<form id="loginForm" action="javascript:void(0);">
  <h2>Login</h2>

  <!-- MESSAGE -->
  <p id="loginMsg" class="text-center fw-semibold mb-3"></p>

  <label>Email</label>
  <input type="email" id="email" name="email" placeholder="Enter your email">
  <p id="emailError" class="text-danger small"></p>

  <label>Password</label>
  <input type="password" id="password" name="password" placeholder="Enter your password">
  <p id="passwordError" class="text-danger small"></p>

  <input type="submit" value="Login">

  <p class="create-account">
    Don't have an account? <a href="signup.html">Create account</a>
  </p>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  let emailError = document.getElementById("emailError");
  let passwordError = document.getElementById("passwordError");
  let msg = document.getElementById("loginMsg");

  // Clear previous errors
  emailError.textContent = "";
  passwordError.textContent = "";
  msg.textContent = "";

  let valid = true;

  // Email validation
  const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  if (email === "") {
    emailError.textContent = "Email is required";
    valid = false;
  } else if (!emailPattern.test(email)) {
    emailError.textContent = "Enter a valid email";
    valid = false;
  }

  // Password validation
  if (password === "") {
    passwordError.textContent = "Password is required";
    valid = false;
  } else if (password.length < 6) {
    passwordError.textContent = "Password must be at least 6 characters";
    valid = false;
  }

  if (!valid) return;

  // AJAX request
  fetch("login.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "email=" + encodeURIComponent(email) +
          "&password=" + encodeURIComponent(password)
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === "success") {
      msg.className = "text-success text-center fw-semibold";
      msg.innerHTML = "✅ Login successful!";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    } else {
      msg.className = "text-danger text-center fw-semibold";
      msg.innerHTML = "❌ " + data.message;
    }
  })
  .catch(() => {
    msg.className = "text-danger text-center fw-semibold";
    msg.innerHTML = "❌ Server error";
  });
});
</script>

</body>
</html>
