<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Abaya Store</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="top-bar text-white py-2 text-center">
  <span class="fw-semibold">NO RETURNS / EXCHANGE AFTER DELIVERY</span>
</div>

<nav class="navbar navbar-light bg-light-yellow">
  <div class="container d-flex justify-content-between align-items-center">

    <button class="btn p-0 border-0" type="button">
      <i class="bi bi-list fs-2"></i>
    </button>

    <a class="navbar-brand fw-bold fs-3" href="index.html">Abaya_Store</a>

    <div class="d-flex align-items-center gap-3">
      <a href="#" class="text-dark"><i class="bi bi-search fs-5"></i></a>
      <a href="wishlist.html" class="text-dark"><i class="bi bi-heart fs-5"></i></a>
      <a href="#" class="text-dark"><i class="bi bi-bag fs-5"></i></a>
      <a href="login.html" class="text-dark"><i class="bi bi-person fs-4"></i></a>
    </div>

  </div>
</nav>

<!-- SIGNUP FORM -->
<form id="loginForm" onsubmit="signupUser(); return false;">
  <h2>Create Account</h2>

  <!-- MESSAGE -->
  <p id="signupMsg" class="text-center fw-semibold mb-3"></p>

  <label>Name</label>
  <input type="text" id="name" placeholder="Enter your name">
  <p id="nameError" class="text-danger small"></p>

  <label>Email</label>
  <input type="email" id="email" placeholder="Enter your email">
  <p id="emailError" class="text-danger small"></p>

  <label>Password</label>
  <input type="password" id="password" placeholder="Create password">
  <p id="passwordError" class="text-danger small"></p>

  <input type="submit" value="Sign Up">

  <p class="create-account">
    Already have an account? <a href="login.html">Login</a>
  </p>
</form>

<script>
function signupUser() {
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  let msg = document.getElementById("signupMsg");
  let nameError = document.getElementById("nameError");
  let emailError = document.getElementById("emailError");
  let passwordError = document.getElementById("passwordError");

  // Clear previous errors
  nameError.textContent = "";
  emailError.textContent = "";
  passwordError.textContent = "";
  msg.textContent = "";

  let valid = true;

  // Name validation
  if (name === "") {
    nameError.textContent = "Name is required";
    valid = false;
  }

  // Email validation
  const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  if (email === "") {
    emailError.textContent = "Email is required";
    valid = false;
  } else if (!emailPattern.test(email)) {
    emailError.textContent = "Enter a valid email";
    valid = false;
  }

  // Password validation
  if (password === "") {
    passwordError.textContent = "Password is required";
    valid = false;
  } else if (password.length < 6) {
    passwordError.textContent = "Password must be at least 6 characters";
    valid = false;
  }

  if (!valid) return;

  // AJAX request
  let xhr = new XMLHttpRequest();
  xhr.open("POST", "signup.php", true);
  xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

  xhr.onload = function () {
    if (this.responseText.trim() === "success") {
      msg.className = "text-success text-center";
      msg.innerHTML = "✅ Signup successful!";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    } else {
      msg.className = "text-danger text-center";
      msg.innerHTML = "❌ Signup failed";
    }
  };

  xhr.send(
    "name=" + encodeURIComponent(name) +
    "&email=" + encodeURIComponent(email) +
    "&password=" + encodeURIComponent(password)
  );
}
</script>

</body>
</html>
